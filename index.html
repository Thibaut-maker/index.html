<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inazuma Eleven Fan Site</title>

<style>
* {
  box-sizing: border-box;
  transition: background-color 0.9s ease, color 0.9s ease;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e6f0ff;
  color: #1f2937;
}

body.dark {
  background: #020617;
  color: #f1f5f9;
}

body.theme-transition {
  animation: themeFade 0.8s ease;
}

@keyframes themeFade {
  from { opacity: 0.9; }
  to { opacity: 1; }
}

header {
  background: #1e40af;
  color: white;
  padding: 30px;
  text-align: center;
  position: relative;
}

#themeBtn {
  position: absolute;
  top: 20px;
  left: 20px;
  padding: 10px 16px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

nav {
  background: #1e3a8a;
  display: flex;
  justify-content: center;
  gap: 25px;
  padding: 15px;
}

nav a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

section {
  max-width: 1000px;
  margin: auto;
  padding: 40px 20px;
}

.gallery img {
  width: 320px;
  border-radius: 15px;
  display: block;
  margin: auto;
}

.personnages {
  display: flex;
  gap: 20px;
  justify-content: center;
}

.personnage {
  background: white;
  padding: 20px;
  border-radius: 15px;
  text-decoration: none;
  color: inherit;
}

body.dark .personnage {
  background: #020617;
}
</style>
</head>

<body>

<header>
  <button id="themeBtn"></button>
  <h1>Inazuma Eleven Fan Site</h1>
</header>

<nav>
  <a href="#presentation">Présentation</a>
  <a href="#galerie">Galerie</a>
  <a href="#personnages">Personnages</a>
</nav>

<section id="galerie">
  <h2>Galerie</h2>
  <div class="gallery">
    <img src="raimon.webp">
  </div>
</section>

<section id="presentation">
  <h2>Présentation</h2>
  <p>Présentation : Inazuma Eleven est un anime mêlant football, stratégie et techniques spectaculaires.</p>
</section>

<section id="personnages">
  <h2>Personnages</h2>
  <div class="personnages">
    <a href="mark.html" class="personnage">⚽ Mark Evans</a>
    <a href="axel.html" class="personnage">🔥 Axel Blaze</a>
    <a href="jude.html" class="personnage">🧠 Jude Sharp</a>
  </div>
</section>

<script>
const btn = document.getElementById("themeBtn");

function applyTheme() {
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
  }
  btn.textContent = document.body.classList.contains("dark")
    ? "🌞 Mode clair"
    : "🌙 Mode sombre";
}

applyTheme();

btn.onclick = () => {
  document.body.classList.add("theme-transition");
  document.body.classList.toggle("dark");
  localStorage.setItem("theme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
  applyTheme();
  setTimeout(() => document.body.classList.remove("theme-transition"), 800);
};
</script>

</body>
</html>
