<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inazuma Eleven Fan Site</title>

  <link rel="icon" type="image/png" href="icon.png">

  <style>
    * { box-sizing: border-box; transition: 0.3s; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #e6f0ff;
      color: #333;
    }

    body.dark-mode {
      background-color: #0c0c2b;
      color: #f0f0f0;
    }

    header {
      position: relative;
      background-color: #001f66;
      color: white;
      text-align: center;
      padding: 30px;
    }

    .mode-header-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 10px 18px;
      cursor: pointer;
    }

    .inazuma-tv-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: bold;
    }

    nav {
      background-color: #0033cc;
      padding: 10px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    section {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
    }

    .gallery {
      display: flex;
      justify-content: center;
    }

    .gallery img {
      width: 280px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }

    #personnages {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .personnage {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      color: inherit;
    }

    body.dark-mode .personnage {
      background: #1a1a40;
    }

    footer {
      background-color: #001f66;
      color: white;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>

<body>

<header>
  <button id="modeBtn" class="mode-header-btn"></button>

  <!-- ✅ BOUTON INAZUMATV -->
  <a href="https://inazumatv.fr/" target="_blank" class="inazuma-tv-btn">
    📺 InazumaTV
  </a>

  <h1>Inazuma Eleven Fan Site</h1>
</header>

<nav>
  <a href="#presentation">Présentation</a>
  <a href="#galerie">Galerie</a>
  <a href="#personnages">Personnages</a>
</nav>

<section id="presentation">
  <h2>Présentation</h2>
  <p>Inazuma Eleven est un anime mêlant football et techniques spéciales.</p>
</section>

<section id="galerie">
  <h2>Galerie</h2>
  <div class="gallery">
    <img src="raimon.webp" alt="Collège Raimon">
  </div>
</section>

<section id="personnages">
  <h2>👥 Personnages</h2>
  <div id="personnages">
    <a href="mark-evans.html" class="personnage">⚽ Mark Evans</a>
    <a href="axel-blaze.html" class="personnage">🔥 Axel Blaze</a>
    <a href="jude-sharp.html" class="personnage">🧠 Jude Sharp</a>
  </div>
</section>

<footer>
  <p>Site fan non officiel • Inazuma Eleven © Level-5</p>
</footer>

<script>
  const modeBtn = document.getElementById("modeBtn");

  // Charger le thème sauvegardé
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  function updateBtn() {
    modeBtn.textContent =
      document.body.classList.contains("dark-mode")
        ? "🌞 Mode clair"
        : "🌙 Mode sombre";
  }

  modeBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");
    localStorage.setItem(
      "theme",
      document.body.classList.contains("dark-mode") ? "dark" : "light"
    );
    updateBtn();
  });

  updateBtn();
</script>

</body>
</html>
