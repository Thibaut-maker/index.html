<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inazuma Eleven Fan Site</title>

  <link rel="icon" type="image/png" href="icon.png">
  <meta name="theme-color" content="#1e40af">

  <style>
    * {
      box-sizing: border-box;
      transition: background-color 0.5s, color 0.5s;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #e6f0ff;
      color: #333;
    }

    body.dark-mode {
      background-color: #0c0c2b;
      color: #f0f0f0;
    }

    header {
      position: relative;
      background-color: #001f66;
      padding: 25px;
      text-align: center;
      color: white;
    }

    body.dark-mode header {
      background-color: #001033;
    }

    .mode-header-btn {
      position: absolute;
      left: 20px;
      top: 20px;
      padding: 10px 16px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: white;
      font-weight: bold;
    }

    .inazumatv-link {
      position: absolute;
      right: 20px;
      top: 20px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    nav {
      background-color: #0033cc;
      padding: 10px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    section {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
    }

    h2 {
      color: #002080;
    }

    body.dark-mode h2 {
      color: #93c5fd;
    }

    .gallery img {
      width: 260px;
      border-radius: 12px;
      display: block;
      margin: auto;
    }

    #personnages {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .personnage {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      font-weight: bold;
    }

    body.dark-mode .personnage {
      background: #1a1a40;
    }

    footer {
      background-color: #001f66;
      color: white;
      text-align: center;
      padding: 15px;
    }

    body.dark-mode footer {
      background-color: #001033;
    }
  </style>
</head>

<body>

<header>
  <button id="modeBtn" class="mode-header-btn"></button>

  <a class="inazumatv-link" href="https://inazumatv.fr/" target="_blank">
    📺 Inazuma TV
  </a>

  <h1>Inazuma Eleven Fan Site</h1>
</header>

<nav>
  <a href="#presentation">Présentation</a>
  <a href="#galerie">Galerie</a>
  <a href="#personnages">Personnages</a>
</nav>

<section id="presentation">
  <h2>Présentation</h2>
  <p>Inazuma Eleven est un anime mêlant football et techniques spéciales.</p>
</section>

<section id="galerie">
  <h2>Galerie</h2>
  <div class="gallery">
    <img src="raimon.webp" alt="Collège Raimon">
  </div>
</section>

<section id="personnages">
  <h2>👥 Personnages</h2>
  <div id="personnages">
    <a href="mark-evans.html" class="personnage">⚽ Mark Evans</a>
    <a href="axel-blaze.html" class="personnage">🔥 Axel Blaze</a>
    <a href="jude-sharp.html" class="personnage">🧠 Jude Sharp</a>
  </div>
</section>

<footer>
  <p>Site fan non officiel • Inazuma Eleven © Level-5</p>
</footer>

<script>
  const modeBtn = document.getElementById("modeBtn");

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  function updateBtn() {
    modeBtn.textContent = document.body.classList.contains("dark-mode")
      ? "🌞 Mode clair"
      : "🌙 Mode sombre";
  }

  updateBtn();

  modeBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");
    localStorage.setItem(
      "theme",
      document.body.classList.contains("dark-mode") ? "dark" : "light"
    );
    updateBtn();
  });
</script>

</body>
</html>
