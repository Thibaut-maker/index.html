<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inazuma Eleven Fan Site</title>

  <link rel="icon" type="image/png" href="icon.png">
  <meta name="theme-color" content="#1e40af">

  <style>
    * {
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #e6f0ff;
      color: #1f2937;
    }

    body.dark-mode {
      background: #0b1024;
      color: #f1f5f9;
    }

    /* ===== HEADER ===== */
    header {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      padding: 35px 20px;
      text-align: center;
      position: relative;
      color: white;
    }

    body.dark-mode header {
      background: linear-gradient(135deg, #020617, #020617);
    }

    h1 {
      margin: 0;
      font-size: 2.4rem;
      letter-spacing: 1px;
    }

    /* ===== BOUTONS HEADER ===== */
    .mode-header-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 18px;
      border-radius: 25px;
      border: none;
      background: #ffffff;
      color: #1e40af;
      font-weight: bold;
      cursor: pointer;
    }

    .inazumatv-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 18px;
      border-radius: 25px;
      background: #facc15;
      color: #1f2937;
      text-decoration: none;
      font-weight: bold;
    }

    .inazumatv-btn:hover {
      transform: scale(1.1);
    }

    /* ===== NAV ===== */
    nav {
      background: #1e3a8a;
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    body.dark-mode nav {
      background: #020617;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* ===== SECTIONS ===== */
    section {
      max-width: 1100px;
      margin: auto;
      padding: 60px 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #1e40af;
    }

    body.dark-mode h2 {
      color: #93c5fd;
    }

    /* ===== GALERIE ===== */
    .gallery {
      display: flex;
      justify-content: center;
    }

    .gallery img {
      width: 320px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    /* ===== PERSONNAGES ===== */
    #personnages {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .personnage {
      background: white;
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      font-size: 1.2rem;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    body.dark-mode .personnage {
      background: #020617;
    }

    .personnage:hover {
      transform: translateY(-8px) scale(1.05);
    }

    /* ===== FOOTER ===== */
    footer {
      background: #1e40af;
      color: white;
      text-align: center;
      padding: 20px;
    }

    body.dark-mode footer {
      background: #020617;
    }

    /* ===== SCROLL TOP ===== */
    #scrollTopBtn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 22px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
    }

    #scrollTopBtn.show {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

<body>

<header>
  <button id="modeBtn" class="mode-header-btn"></button>

  <a href="https://inazumatv.fr/" target="_blank" class="inazumatv-btn">
    📺 InazumaTV
  </a>

  <h1>Inazuma Eleven Fan Site</h1>
</header>

<nav>
  <a href="#presentation">Présentation</a>
  <a href="#galerie">Galerie</a>
  <a href="#personnages">Personnages</a>
</nav>

<section id="presentation">
  <h2>Présentation</h2>
  <p style="text-align:center;font-size:1.1rem;">
    Inazuma Eleven est un anime mêlant football, stratégie et techniques spectaculaires.
  </p>
</section>

<section id="galerie">
  <h2>Galerie</h2>
  <div class="gallery">
    <img src="raimon.webp" alt="Collège Raimon">
  </div>
</section>

<section id="personnages">
  <h2>👥 Personnages</h2>
  <div id="personnages">
    <a href="mark-evans.html" class="personnage">⚽ Mark Evans</a>
    <a href="axel-blaze.html" class="personnage">🔥 Axel Blaze</a>
    <a href="jude-sharp.html" class="personnage">🧠 Jude Sharp</a>
  </div>
</section>

<footer>
  <p>Site fan non officiel • Inazuma Eleven © Level-5</p>
</footer>

<button id="scrollTopBtn">⬆</button>

<script>
  const modeBtn = document.getElementById("modeBtn");
  const scrollBtn = document.getElementById("scrollTopBtn");

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  function updateModeButton() {
    modeBtn.textContent = document.body.classList.contains("dark-mode")
      ? "🌞 Mode clair"
      : "🌙 Mode sombre";
  }

  updateModeButton();

  modeBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");
    localStorage.setItem(
      "theme",
      document.body.classList.contains("dark-mode") ? "dark" : "light"
    );
    updateModeButton();
  });

  window.addEventListener("scroll", () => {
    scrollBtn.classList.toggle("show", window.scrollY > 300);
  });

  scrollBtn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
</script>

</body>
</html>
