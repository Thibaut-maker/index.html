<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inazuma Eleven Fan Site</title>

<link rel="icon" href="icon.png">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e6f0ff;
  color: #1f2937;
  transition: background-color 0.6s ease, color 0.6s ease;
}

body.dark-mode {
  background: #0b1024;
  color: #f1f5f9;
}

/* animation de transition */
body.theme-transition {
  animation: themeFade 0.5s ease;
}

@keyframes themeFade {
  from { opacity: 0.85; }
  to { opacity: 1; }
}

/* HEADER */
header {
  background: #1e40af;
  color: white;
  padding: 30px;
  text-align: center;
  position: relative;
}

.mode-header-btn {
  position: absolute;
  top: 20px;
  left: 20px;
  padding: 10px 18px;
  border-radius: 25px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.inazumatv-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  padding: 10px 18px;
  border-radius: 25px;
  background: #facc15;
  color: #1f2937;
  text-decoration: none;
  font-weight: bold;
}

/* SECTIONS */
section {
  max-width: 1000px;
  margin: auto;
  padding: 40px 20px;
}

.gallery {
  text-align: center;
}

.gallery img {
  width: 320px;
  border-radius: 16px;
}

/* PERSONNAGES */
.personnages-wrapper {
  display: flex;
  align-items: center;
  gap: 30px;
  justify-content: center;
}

.personnages-title {
  font-size: 1.5rem;
  font-weight: bold;
}

.personnages {
  display: flex;
  gap: 20px;
}

.personnage {
  background: white;
  padding: 20px;
  border-radius: 16px;
  text-decoration: none;
  color: inherit;
  font-weight: bold;
}

body.dark-mode .personnage {
  background: #020617;
}
</style>
</head>

<body>

<header>
  <button id="modeBtn" class="mode-header-btn"></button>
  <a href="https://inazumatv.fr/" target="_blank" class="inazumatv-btn">📺 InazumaTV</a>
  <h1>Inazuma Eleven Fan Site</h1>
</header>

<section>
  <div class="gallery">
    <img src="raimon.webp" alt="Collège Raimon">
  </div>

  <p style="text-align:center;font-size:1.1rem;margin-top:25px;">
    <strong>Présentation :</strong> Inazuma Eleven est un anime mêlant football,
    stratégie et techniques spectaculaires.
  </p>
</section>

<section>
  <div class="personnages-wrapper">
    <div class="personnages-title">👥 Personnages</div>
    <div class="personnages">
      <a href="mark-evans.html" class="personnage">⚽ Mark Evans</a>
      <a href="axel-blaze.html" class="personnage">🔥 Axel Blaze</a>
      <a href="jude-sharp.html" class="personnage">🧠 Jude Sharp</a>
    </div>
  </div>
</section>

<script src="theme.js"></script>
</body>
</html>
