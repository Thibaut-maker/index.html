<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jude Sharp</title>

  <style>
    * {
      box-sizing: border-box;
      transition: 0.3s;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #e6f0ff;
      color: #1f2937;
    }

    body.dark-mode {
      background: #0b1024;
      color: #f1f5f9;
    }

    header {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      padding: 35px 20px;
      text-align: center;
      position: relative;
      color: white;
    }

    body.dark-mode header {
      background: #020617;
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
    }

    .mode-header-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 18px;
      border-radius: 25px;
      border: none;
      background: #ffffff;
      color: #1e40af;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 60px 20px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      font-size: 1.1rem;
    }

    body.dark-mode .card {
      background: #020617;
    }
  </style>
</head>

<body>

<header>
  <button id="modeBtn" class="mode-header-btn"></button>
  <h1>🧠 Jude Sharp</h1>
</header>

<main>
  <div class="card">
    <p><strong>Poste :</strong> Milieu de terrain</p>
    <p><strong>Rôle :</strong> Stratège de l’équipe Raimon</p>
    <p><strong>Spécialité :</strong> Analyse et tactique</p>
    <p><strong>Techniques :</strong> Passe Mirage, Contrôle Parfait</p>
  </div>
</main>

<!-- ✅ SCRIPT MODE SOMBRE (IDENTIQUE PARTOUT) -->
<script>
  const modeBtn = document.getElementById("modeBtn");

  // Appliquer le thème au chargement
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  function updateModeButton() {
    if (!modeBtn) return;
    modeBtn.textContent = document.body.classList.contains("dark-mode")
      ? "🌞 Mode clair"
      : "🌙 Mode sombre";
  }

  updateModeButton();

  // Changer le thème
  if (modeBtn) {
    modeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      localStorage.setItem(
        "theme",
        document.body.classList.contains("dark-mode") ? "dark" : "light"
      );
      updateModeButton();
    });
  }
</script>

</body>
</html>
