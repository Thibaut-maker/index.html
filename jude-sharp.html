<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jude Sharp</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e6f0ff;
  color: #1f2937;
  transition: background-color 0.6s ease, color 0.6s ease;
}

body.dark-mode {
  background: #0b1024;
  color: #f1f5f9;
}

body.theme-transition {
  animation: themeFade 0.5s ease;
}

@keyframes themeFade {
  from { opacity: 0.85; }
  to { opacity: 1; }
}

header {
  background: #334155;
  color: white;
  padding: 30px;
  text-align: center;
  position: relative;
}

.mode-header-btn {
  position: absolute;
  top: 20px;
  left: 20px;
  padding: 10px 18px;
  border-radius: 25px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.back-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: #facc15;
  padding: 10px 18px;
  border-radius: 25px;
  text-decoration: none;
  color: #1f2937;
  font-weight: bold;
}

section {
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
  text-align: center;
}
</style>
</head>

<body>

<header>
  <button id="modeBtn" class="mode-header-btn"></button>
  <a href="index.html" class="back-btn">⬅ Accueil</a>
  <h1>🧠 Jude Sharp</h1>
</header>

<section>
  <p>
    <strong>Présentation :</strong> Jude Sharp est le cerveau de l’équipe,
    un stratège de génie capable d’analyser chaque situation sur le terrain.
  </p>
</section>

<script src="theme.js"></script>
</body>
</html>
