<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark Evans</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e6f0ff;
      color: #1f2937;
      transition: 0.3s;
    }

    body.dark-mode {
      background: #0b1024;
      color: #f1f5f9;
    }

    header {
      background: #1e40af;
      padding: 30px;
      text-align: center;
      color: white;
      position: relative;
    }

    body.dark-mode header {
      background: #020617;
    }

    .mode-header-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      padding: 8px 16px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <button id="modeBtn" class="mode-header-btn"></button>
  <h1>⚽ Mark Evans</h1>
</header>

<main>
  <p>Gardien légendaire de Raimon.</p>
  <p>Technique : <strong>Main Céleste</strong></p>
</main>

<!-- ✅ SCRIPT MODE SOMBRE -->
<script>
  const modeBtn = document.getElementById("modeBtn");

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  function updateModeButton() {
    if (!modeBtn) return;
    modeBtn.textContent = document.body.classList.contains("dark-mode")
      ? "🌞 Mode clair"
      : "🌙 Mode sombre";
  }

  updateModeButton();

  if (modeBtn) {
    modeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      localStorage.setItem(
        "theme",
        document.body.classList.contains("dark-mode") ? "dark" : "light"
      );
      updateModeButton();
    });
  }
</script>

</body>
</html>
