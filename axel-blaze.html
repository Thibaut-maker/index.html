<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Axel Blaze</title>
<style>
body { font-family: Arial; margin: 0; background: #e6f0ff; transition: 0.9s; }
body.dark { background: #020617; color: white; }
button { margin: 20px; padding: 10px 15px; }
</style>
</head>

<body>

<button onclick="location.href='index.html'">⬅ Retour</button>
<button id="themeBtn"></button>

<h1>🔥 Axel Blaze</h1>
<p>Attaquant – Frappe du Tigre</p>

<script>
const btn=document.getElementById("themeBtn");
if(localStorage.getItem("theme")==="dark")document.body.classList.add("dark");
btn.textContent=document.body.classList.contains("dark")?"🌞 Mode clair":"🌙 Mode sombre";
btn.onclick=()=>{
document.body.classList.toggle("dark");
localStorage.setItem("theme",document.body.classList.contains("dark")?"dark":"light");
btn.textContent=document.body.classList.contains("dark")?"🌞 Mode clair":"🌙 Mode sombre";
}
</script>

</body>
</html>
